services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # 不对外暴露。frontend nginx 通过 compose 内网访问 backend:8000;
    # 仅绑宿主机 127.0.0.1,供本机 curl/调试,避免 8000 直接暴露到公网。
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # 证书与 ACME webroot 为宿主机目录挂载(不入镜像、不入 git),供 certbot 签发/续期
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/usr/share/nginx/webroot:ro
    depends_on:
      backend:
        condition: service_healthy
