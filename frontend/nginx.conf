# OfferSpar 生产 nginx 配置(容器内):
# - 80 端口:ACME webroot 供 certbot 签发/续期证书,其余请求 301 跳 HTTPS
# - 443 端口:静态站 + 反代 /api、/ws 到 backend:8000
# 证书路径为镜像内固定路径,由宿主机 ./certs 目录挂载到 /etc/nginx/certs(域名无关)。
# 上传大小上限对齐后端 MAX_UPLOAD_BYTES(500MB),避免录音复盘/数据迁移被 nginx 提前 413。

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    # Let's Encrypt webroot 验证(宿主机 ./certbot-webroot 挂载进来)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    client_max_body_size 500m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 静态站(SPA)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API(含 SSE 流式,读写超时给足)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
    }

    # WebSocket(Copilot 实时语音)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
